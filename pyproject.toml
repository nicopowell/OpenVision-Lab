[project]
name = "openvision-lab"
version = "0.1.0"
description = "A desktop playground for learning and experimenting with Computer Vision."
requires-python = ">=3.14"
dependencies = [
    "PySide6==6.11.2",
    "opencv-python==4.14.0.94",
    "numpy==2.5.3",
]

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-qt==4.5.0",
    "ruff==0.16.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
files = ["openvision_lab"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.coverage.run]
source = ["openvision_lab"]
branch = true

[tool.coverage.report]
show_missing = true
